<!doctype html>
<html>
<head><meta charset="utf-8"><title>Three.js базовый тест</title>
<style>body{margin:0;background:#050505;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050505);
document.body.appendChild(renderer.domElement);

const geo = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 });
const cube = new THREE.Mesh(geo, mat);
scene.add(cube);

scene.add(new THREE.DirectionalLight(0xffffff, 2).translateZ(5));
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

(function loop(){
  requestAnimationFrame(loop);
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.015;
  renderer.render(scene, camera);
})();

console.log('✅ Three.js works. Cube should be spinning.');
</script>
</body>
</html>
